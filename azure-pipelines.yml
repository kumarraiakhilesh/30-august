variables:
  workingDir: '$(System.DefaultWorkingDirectory)'
  serviceArm: 'sept7'                     # आपका Service Connection नाम
  backendRG: 'akhileshtestpip2'
  backendSA: 'akhileshstoragepip2'
  backendContainer: 'akhileshcanttest'
  backendKey: 'pipe.tfstate'

steps:
# =============================================================
# 1. TERRAFORM INIT
# =============================================================
- task: TerraformTask@5
  displayName: '1. Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: $(workingDir)
    backendServiceArm: $(serviceArm)
    backendAzureRmResourceGroupName: $(backendRG)
    backendAzureRmStorageAccountName: $(backendSA)
    backendAzureRmContainerName: $(backendContainer)
    backendAzureRmKey: $(backendKey)

# =============================================================
# 2. TERRAFORM VALIDATE
# =============================================================
- task: TerraformTask@5
  displayName: '2. Terraform Validate'
  inputs:
    provider: 'azurerm'
    command: 'validate'
    workingDirectory: $(workingDir)
    environmentServiceNameAzureRM: $(serviceArm)

# =============================================================
# 3. SCANNING TOOLS (Security & Code Quality)
# =============================================================

# Tool 1: TFLint (Terraform Linter)
- task: PowerShell@2
  displayName: '3.1 Scan: TFLint'
  continueOnError: true
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Running TFLint..."
      cd $(workingDir)
      tflint --init
      tflint

# Tool 2: Checkov (IaC Static Code Security Scanner)
- task: PowerShell@2
  displayName: '3.2 Scan: Checkov'
  continueOnError: true
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Running Checkov Scanner..."
      checkov -d $(workingDir) --framework terraform --compact

# Tool 3: TFSec (Terraform Security Scanner)
- task: PowerShell@2
  displayName: '3.3 Scan: TFSec'
  continueOnError: true
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Running TFSec..."
      tfsec $(workingDir)

# Tool 4: Gitleaks (Detect Hardcoded Secrets in Git)
- task: PowerShell@2
  displayName: '3.4 Scan: Gitleaks'
  continueOnError: true
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Running Gitleaks..."
      gitleaks detect --source="$(System.DefaultWorkingDirectory)" --verbose

# Tool 5: TruffleHog (Find Leaked API Keys / Secrets)
- task: PowerShell@2
  displayName: '3.5 Scan: TruffleHog'
  continueOnError: true
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Running TruffleHog..."
      trufflehog filesystem $(workingDir) --no-update

# =============================================================
# 4. TERRAFORM PLAN (स्कैनिंग पूरी होने के बाद)
# =============================================================
- task: TerraformTask@5
  displayName: '4. Terraform Plan'
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: $(workingDir)
    environmentServiceNameAzureRM: $(serviceArm)

# =============================================================
# 5. TERRAFORM APPLY (केवल तभी चलेगा जब कोड main में मर्ज होगा)
# =============================================================
- task: TerraformTask@5
  displayName: '5. Terraform Apply'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: $(workingDir)
    environmentServiceNameAzureRM: $(serviceArm)