trigger:
- main
- feature/*

pr:
- main

pool:
  name: 'Sept7'
  demands:
  - Agent.Name -equals Sept7agent

variables:
  workingDir: '$(System.DefaultWorkingDirectory)/Env/Dev'
  serviceArm: 'sept7'
  backendRG: 'akhileshtestpip2'
  backendSA: 'akhileshstoragepip2'
  backendContainer: 'akhileshcanttest'
  backendKey: 'pipe.tfstate'

jobs:
# =============================================================
# JOB 1: VALIDATION & SECURITY SCANS
# =============================================================
- job: SecurityAndValidation
  displayName: '1. Validation & Security Scans'
  steps:
  # 1.0 Install Terraform
  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  # 1.1 Terraform Init
  - task: TerraformTask@5
    displayName: 'Terraform Init'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(workingDir)'
      backendServiceArm: $(serviceArm)
      backendAzureRmResourceGroupName: $(backendRG)
      backendAzureRmStorageAccountName: $(backendSA)
      backendAzureRmContainerName: $(backendContainer)
      backendAzureRmKey: $(backendKey)

  # 1.2 Terraform Validate
  - task: TerraformTask@5
    displayName: 'Terraform Validate'
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(workingDir)'
      environmentServiceNameAzureRM: $(serviceArm)

  # 1.3 Tool: TFLint
  - task: PowerShell@2
    displayName: 'Scan: TFLint'
    continueOnError: true
    inputs:
      targetType: 'inline'
      workingDirectory: '$(workingDir)'
      script: |
        Write-Host "Running TFLint..."
        tflint --init
        tflint
        if ($LASTEXITCODE -ne 0) { Write-Host "TFLint found issues or exited with code $LASTEXITCODE"; $LASTEXITCODE = 0 }

  # 1.4 Tool: Checkov
  - task: PowerShell@2
    displayName: 'Scan: Checkov'
    continueOnError: true
    inputs:
      targetType: 'inline'
      workingDirectory: '$(workingDir)'
      script: |
        Write-Host "Running Checkov..."
        checkov -d . --framework terraform --compact --soft-fail

  # 1.5 Tool: TFSec
  - task: PowerShell@2
    displayName: 'Scan: TFSec'
    continueOnError: true
    inputs:
      targetType: 'inline'
      workingDirectory: '$(workingDir)'
      script: |
        Write-Host "Running TFSec..."
        tfsec . --soft-fail

  # 1.6 Tool: Gitleaks
  - task: PowerShell@2
    displayName: 'Scan: Gitleaks'
    continueOnError: true
    inputs:
      targetType: 'inline'
      workingDirectory: '$(System.DefaultWorkingDirectory)'
      script: |
        Write-Host "Running Gitleaks..."
        gitleaks detect --source="." --verbose
        if ($LASTEXITCODE -ne 0) { Write-Host "Gitleaks found issues or exited with code $LASTEXITCODE"; $LASTEXITCODE = 0 }

  # 1.7 Tool: TruffleHog
  - task: PowerShell@2
    displayName: 'Scan: TruffleHog'
    continueOnError: true
    inputs:
      targetType: 'inline'
      workingDirectory: '$(workingDir)'
      script: |
        Write-Host "Running TruffleHog..."
        trufflehog filesystem . --no-update
        if ($LASTEXITCODE -ne 0) { Write-Host "TruffleHog found issues or exited with code $LASTEXITCODE"; $LASTEXITCODE = 0 }

# =============================================================
# JOB 2: TERRAFORM PLAN (Job 1 पास होने के बाद चलेगा)
# =============================================================
- job: TerraformPlan
  displayName: '2. Terraform Plan'
  dependsOn: SecurityAndValidation
  steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTask@5
    displayName: 'Terraform Init for Plan'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(workingDir)'
      backendServiceArm: $(serviceArm)
      backendAzureRmResourceGroupName: $(backendRG)
      backendAzureRmStorageAccountName: $(backendSA)
      backendAzureRmContainerName: $(backendContainer)
      backendAzureRmKey: $(backendKey)

  - task: TerraformTask@5
    displayName: 'Terraform Plan'
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(workingDir)'
      environmentServiceNameAzureRM: $(serviceArm)

# =============================================================
# JOB 3: TERRAFORM APPLY (केवल main ब्रांच पर चलेगा)
# =============================================================
- job: TerraformApply
  displayName: '3. Terraform Apply'
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTask@5
    displayName: 'Terraform Init for Apply'
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(workingDir)'
      backendServiceArm: $(serviceArm)
      backendAzureRmResourceGroupName: $(backendRG)
      backendAzureRmStorageAccountName: $(backendSA)
      backendAzureRmContainerName: $(backendContainer)
      backendAzureRmKey: $(backendKey)

  - task: TerraformTask@5
    displayName: 'Terraform Apply'
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(workingDir)'
      environmentServiceNameAzureRM: $(serviceArm)